# config/database.yml
development:
  adapter: postgresql
  encoding: unicode
  database: learn_something_development
  username: postgres
  password: postgres
  host: db
  pool: 5

test:
  adapter: postgresql
  encoding: unicode
  database: learn_something_test
  username: postgres
  password: postgres
  host: db
  pool: 5
  
default: &default
  adapter: postgresql  # or sqlite3, mysql2
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: learn_something_development

test:
  <<: *default
  database: learn_something_test

production:
  <<: *default
  url: <%= ENV['DATABASE_URL'] %>